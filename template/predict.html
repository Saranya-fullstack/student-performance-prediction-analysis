
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Student Marks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='prediction.js') }}" defer></script>
</head>
<body>

<nav class="navbar">
    <h2>Student Performance</h2>
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/predict">Predict</a>
        <a href="/students">Students</a>
        <a href="/dashboard">Dashboard</a>
    </div>
</nav>

{% include "_latest_prediction.html" %}

<div class="form-container">
    <h1>Student Performance Prediction</h1>
    <p>Enter student academic details below.</p>

    <form id="prediction-form" onsubmit="return false;">

        <label for="student-name">Student Name</label>
        <input id="student-name" type="text" name="student_name"
               placeholder="Enter student name" maxlength="120" required>

        <label for="study-hours">Study Hours Per Day</label>
        <input id="study-hours" type="number" name="study_hours"
               min="0" max="24" step="0.1" required>

        <label for="attendance">Attendance Percentage</label>
        <input id="attendance" type="number" name="attendance"
               min="0" max="100" step="0.1" required>

        <label for="previous-marks">Previous Marks</label>
        <input id="previous-marks" type="number" name="previous_marks"
               min="0" max="100" step="0.1" required>

        <label for="assignment-score">Assignment Score</label>
        <input id="assignment-score" type="number" name="assignment_score"
               min="0" max="100" step="0.1" required>

        <label for="sleep-hours">Sleep Hours</label>
        <input id="sleep-hours" type="number" name="sleep_hours"
               min="0" max="24" step="0.1" required>

        <button type="submit" class="btn">Predict Marks</button>
    </form>

</div>

</body>
</html>
